name: moma
description: Moma - AI Catat Uang

publish_to: 'none'

version: 1.0.5+13

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  device_info_plus: ^10.1.0
  file_picker: ^8.0.3
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # File & Share
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  csv: ^6.0.0
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Routing
  go_router: 13.2.0

  # Google Auth
  google_sign_in: ^6.2.1

  # HTTP Client
  dio: ^5.7.0

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3

  # Security
  local_auth: ^2.3.0
  crypto: ^3.0.3

  # In-App Purchase
  in_app_purchase: ^3.2.0

  # Ads
  google_mobile_ads: ^5.1.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Utils
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.5

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo-app-moma.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/logo-app-moma.png"
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
    - assets/lottie/
    - env/.env.development
    - env/.env.staging
    - env/.env.production

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700